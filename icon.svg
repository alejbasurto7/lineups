<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background so the same art works as a maskable icon. Sport-neutral: no pitch or court markings. -->
  <rect width="512" height="512" fill="#2e7d32"/>
  <!-- Mowing stripes -->
  <g fill="#388e3c">
    <rect y="32" width="512" height="64"/>
    <rect y="160" width="512" height="64"/>
    <rect y="288" width="512" height="64"/>
    <rect y="416" width="512" height="64"/>
  </g>
  <!-- Clipboard -->
  <rect x="92" y="92" width="328" height="380" rx="34" fill="#ffffff"/>
  <!-- Silver clip -->
  <rect x="186" y="60" width="140" height="62" rx="18" fill="#aeb5bd"/>
  <rect x="186" y="60" width="140" height="40" rx="18" fill="#cfd4da"/>
  <rect x="200" y="66" width="112" height="8" rx="4" fill="#eef1f4"/>
  <circle cx="256" cy="84" r="10" fill="#388e3c"/>
  <!-- Lineup: players forming an L, the corner player (red) is the one being placed -->
  <g fill="#1d4ed8">
    <circle cx="185.2" cy="183.8" r="29.5"/>
    <circle cx="185.2" cy="254.6" r="29.5"/>
    <circle cx="185.2" cy="325.4" r="29.5"/>
    <circle cx="256" cy="396.2" r="29.5"/>
    <circle cx="326.8" cy="396.2" r="29.5"/>
  </g>
  <circle cx="185.2" cy="396.2" r="29.5" fill="#dc2626"/>
</svg>
